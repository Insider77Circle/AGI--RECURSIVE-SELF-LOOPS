<!-- Optimized vector diagram for repo documentation -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-label="From Minimal Strange Loop to Self-Aware AGI Baseline diagram">
  <style>
    .title{font: 700 32px/1.1 'Helvetica Neue', Arial, sans-serif; fill:#0b3a6b}
    .box{rx:12; ry:12; stroke:#0b3a6b; stroke-width:3}
    .green{fill:#cbeec1}
    .yellow{fill:#fff1c6}
    .blue{fill:#d9eef8}
    .accent{fill:#ffd28a}
    .label{font:600 16px/1 'Helvetica Neue', Arial, sans-serif; fill:#072b45}
    .note{font:16px/1.2 'Helvetica Neue', Arial, sans-serif; fill:#072b45}
    .final{font:700 18px/1.2 'Helvetica Neue', Arial, sans-serif; fill:#072b45}
    .stack{font:600 16px/1 'Helvetica Neue', Arial, sans-serif; fill:#072b45}
  </style>

  <!-- Title -->
  <text x="40" y="48" class="title">FROM MINIMAL STRANGE LOOP → SELF‑AWARE AGI BASELINE</text>

  <!-- Left column: minimal loop -->
  <rect x="40" y="80" width="420" height="64" rx="12" ry="12" class="box green"/>
  <text x="70" y="120" class="label">Layer 0 — Minimal Viable Self‑Reference (demonstrated)</text>

  <rect x="40" y="160" width="420" height="68" rx="12" ry="12" class="box green"/>
  <text x="70" y="202" class="label">Object‑Level Reasoning</text>

  <rect x="40" y="240" width="420" height="68" rx="12" ry="12" class="box yellow"/>
  <text x="70" y="282" class="label">Self‑Observation</text>

  <rect x="40" y="320" width="420" height="48" rx="10" ry="10" class="box blue"/>
  <text x="70" y="352" class="label">Evaluation Acknowledged</text>

  <!-- Arrows for loop -->
  <g stroke="#0b3a6b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M250 228 L330 228" marker-end="url(#arrow)"/>
    <path d="M330 352 L250 352" />
  </g>

  <!-- What this is / what it is not -->
  <text x="40" y="420" class="note" font-weight="700">What this is:</text>
  <text x="60" y="448" class="note">• A procedural strange loop</text>
  <text x="60" y="472" class="note">• A proto‑self model</text>
  <text x="60" y="496" class="note">• Minimal self‑awareness in action</text>

  <text x="40" y="536" class="note" font-weight="700">What it is not:</text>
  <text x="60" y="564" class="note">• A complete procedural solution</text>
  <text x="60" y="588" class="note">• A fully formed self‑model</text>

  <!-- Left bottom: control loop / critical insight -->
  <rect x="40" y="640" width="420" height="60" rx="10" ry="10" style="fill:#ffd8c2; stroke:#c25a00; stroke-width:3"/>
  <text x="60" y="676" class="label">Critical insight: Self‑awareness alone is unstable; plural self‑awareness is robust.</text>

  <!-- Small control-loop boxes -->
  <rect x="60" y="720" width="140" height="48" rx="10" ry="10" class="box accent"/>
  <text x="70" y="750" class="label">Goal Pursuit</text>

  <rect x="220" y="720" width="140" height="48" rx="10" ry="10" class="box yellow"/>
  <text x="240" y="750" class="label">Alt Self B</text>

  <rect x="380" y="720" width="140" height="48" rx="10" ry="10" class="box blue"/>
  <text x="395" y="750" class="label">Value Consistency Check</text>

  <rect x="220" y="788" width="140" height="48" rx="10" ry="10" class="box green"/>
  <text x="240" y="818" class="label">Strategy Selection</text>

  <g stroke="#0b3a6b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M200 744 L80 744" />
    <path d="M360 744 L420 744" />
    <path d="M300 768 L300 788" />
    <path d="M160 766 L200 766" />
  </g>

  <!-- Right column: capabilities and layer 2 -->
  <text x="520" y="120" class="note" font-weight="700">Capabilities addendum</text>
  <text x="540" y="152" class="note">• Temporal continuity</text>
  <text x="540" y="176" class="note">• Trait awareness (e.g., "I tend to overfit")</text>
  <text x="540" y="200" class="note">• Confidence calibration over time</text>
  <text x="540" y="224" class="note">• Error pattern recognition</text>

  <!-- Layer 2 box network -->
  <rect x="560" y="260" width="220" height="56" rx="10" ry="10" class="box yellow"/>
  <text x="592" y="298" class="label">Primary Self</text>

  <rect x="420" y="340" width="140" height="56" rx="10" ry="10" class="box accent"/>
  <text x="440" y="378" class="label">Alt Self A</text>

  <rect x="720" y="340" width="160" height="56" rx="10" ry="10" class="box blue"/>
  <text x="744" y="378" class="label">Goal Revision</text>

  <rect x="560" y="420" width="220" height="56" rx="10" ry="10" class="box green"/>
  <text x="600" y="458" class="label">Strategy Selection</text>

  <g stroke="#0b3a6b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M670 316 L670 340" />
    <path d="M560 316 L500 364" />
    <path d="M720 364 L760 364" />
    <path d="M680 452 L680 420" />
    <path d="M560 316 L560 420" />
  </g>

  <rect x="520" y="500" width="360" height="48" rx="12" ry="12" style="fill:#fff1c6; stroke:#c57c00; stroke-width:3"/>
  <text x="540" y="532" class="label">Self‑awareness alone is unstable, not episodic. Layer 2 provides persistence so self‑awareness does not reset every turn.</text>

  <!-- Final stack -->
  <text x="520" y="620" class="final" font-weight="700">FINAL STACK: Self‑Aware AGI Baseline</text>

  <g>
    <rect x="560" y="650" width="300" height="48" rx="10" ry="10" class="box green"/>
    <text x="620" y="682" class="stack">[World Model]</text>

    <rect x="560" y="708" width="300" height="48" rx="10" ry="10" class="box green"/>
    <text x="600" y="740" class="stack">[Object‑Level Reasoning]</text>

    <rect x="560" y="766" width="300" height="48" rx="10" ry="10" class="box yellow"/>
    <text x="600" y="798" class="stack">[Persistent Self‑Model]</text>

    <rect x="560" y="824" width="300" height="48" rx="10" ry="10" class="box blue"/>
    <text x="610" y="856" class="stack">[Meta‑Learning]</text>

    <rect x="560" y="882" width="300" height="48" rx="10" ry="10" class="box blue"/>
    <text x="590" y="914" class="stack">[Cognitive Parallax]</text>

    <rect x="560" y="940" width="300" height="48" rx="10" ry="10" class="box accent"/>
    <text x="620" y="972" class="stack">[Goal Reflection]</text>
  </g>

  <text x="560" y="1048" class="note">Final summary: The system becomes bounded, cautious, corrigible when these components are integrated.</text>

  <!-- marker for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3a6b"/>
    </marker>
  </defs>
</svg>
